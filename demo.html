<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démo — Lìonra CookieConsent</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #0b0d12;
      color: #f2f2f4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, color .2s;
    }

    html[data-theme="light"] body {
      background: #f5f6f8;
      color: #15171c;
    }

    .card {
      max-width: 520px;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: .5rem;
    }

    p {
      opacity: .7;
      line-height: 1.6;
    }

    .row {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.5rem;
    }

    button {
      font: inherit;
      font-weight: 600;
      font-size: .85rem;
      padding: .65rem 1.1rem;
      border-radius: 9px;
      border: 1px solid rgba(127, 127, 127, .3);
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    button:hover {
      background: rgba(127, 127, 127, .12);
    }

    #btn-cookie-settings {
      border-color: #00e676;
      color: #00e676;
    }

    pre {
      text-align: left;
      background: rgba(127, 127, 127, .1);
      padding: 1rem;
      border-radius: 10px;
      font-size: .75rem;
      overflow: auto;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🍪 Démo CookieConsent</h1>
    <p>
      Le bandeau apparaît automatiquement après ~1s. Testez les boutons ci-dessous
      pour changer le thème, la langue ou rouvrir vos préférences — exactement comme
      un vrai visiteur pourrait le faire depuis votre footer.
    </p>
    <div class="row">
      <button id="btn-cookie-settings">Gérer mes cookies</button>
      <button id="toggle-theme">Basculer thème clair/sombre</button>
      <button id="toggle-lang">FR / EN</button>
      <button id="btn-reset">Réinitialiser le consentement</button>
    </div>
    <pre id="log">En attente d'une action…</pre>
  </div>

  <script src="cookieconsent.js"></script>
  <script>
    let lang = 'en';

    function boot() {
      CookieConsent.init({
        companyName: "My App",
        layout: "modal",
        showFloatingButton: true,
      });
    }
    boot();

    document.getElementById('toggle-theme').addEventListener('click', () => {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
    });

    document.getElementById('toggle-lang').addEventListener('click', () => {
      lang = lang === 'fr' ? 'en' : 'fr';
      boot(); // ré-initialise avec la nouvelle langue (garde le consentement stocké)
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      CookieConsent.reset();
      document.getElementById('log').textContent = 'Consentement réinitialisé.';
    });
  </script>
</body>

</html>
